[project]
name = "soupgrpo"
version = "0.1.0"
description = "GRPO + LoRA on Qwen3-4B under an 8 GB GPU cap, with a custom layer-to-layer streaming engine"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "transformers>=4.51",
    "jinja2>=3.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soupgrpo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
